name: pocket_room
description: "자취생을 위한 통합 공과금/월세 관리 앱 — Pocket Room"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 로컬 DB
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5

  # 민감정보 저장 (Keychain/Keystore)
  flutter_secure_storage: ^9.2.4

  # 상태 관리
  provider: ^6.1.5

  # 서버(REST API) 호출 — 백엔드 연동(세션 C-A~)
  http: ^1.2.2

  # 날짜·통화 포맷팅
  intl: ^0.20.2

  # 차트 (월별 요금 그래프)
  fl_chart: ^0.70.2

  # 알림
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0 # 알림 예약 시각 계산(한국 타임존)

  # 이미지 선택 (OCR stub용)
  image_picker: ^1.1.2

  # 해시 (비밀번호 SHA-256)
  crypto: ^3.0.6
  sqflite_common_ffi_web: ^1.1.1

  # OCR — 웹 빌드 불가로 현재 주석 처리, 나중에 iOS/Android 전용으로 활성화
  # google_mlkit_text_recognition: ^0.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
